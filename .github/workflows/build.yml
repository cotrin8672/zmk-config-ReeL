name: Build ReeL ZMK firmware
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@acfd8e5ea76cf23ad1c9b6b99848f97a95224257
    with:
      fallback_binary: hex
      archive_name: reel-zmk-build

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reel-zmk-build
      - name: Package the CX-40 application for its factory USB bootloader
        run: |
          test -s reel_left.uf2 && test -s reel_right.uf2 && test -s reel_dongle.hex
          curl --fail --location --retry 3 https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil -o nrfutil
          chmod +x nrfutil
          ./nrfutil install nrf5sdk-tools==1.1.0
          ./nrfutil nrf5sdk-tools pkg generate --hw-version 52 --sd-req 0x00 --application-version 1 --application reel_dongle.hex reel_dongle.zip
          unzip -t reel_dongle.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reel-zmk-firmware
          path: |
            reel_left.uf2
            reel_right.uf2
            reel_dongle.zip
          if-no-files-found: error
