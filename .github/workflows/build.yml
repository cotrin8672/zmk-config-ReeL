name: Build ReeL ZMK firmware
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  display-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/lvgl
          ref: f1db87ee98f1810328a8419572fa42a3b5f352ae
          path: .ci-lvgl
      - uses: actions/checkout@v4
        with:
          repository: zmkfirmware/zephyr
          ref: 10ba6d0cb38bc3d258775d27982f707599320085
          path: .ci-zephyr
          sparse-checkout: modules/lvgl
      - name: Check assets and render the actual LVGL screen
        run: |
          python3 -m pip install Pillow
          python3 tools/generate-display-assets.py --check
          cmake -S tests/display -B /tmp/reel-display -DLVGL_DIR="$GITHUB_WORKSPACE/.ci-lvgl" -DZEPHYR_DIR="$GITHUB_WORKSPACE/.ci-zephyr" -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/reel-display --target reel_display_preview --parallel 2
          mkdir /tmp/reel-render
          /tmp/reel-display/reel_display_preview /tmp/reel-render
          python3 tests/display/verify.py /tmp/reel-render
          cmake -S tests/display -B /tmp/reel-display -DREEL_TEST_INVERTED=OFF
          cmake --build /tmp/reel-display --target reel_display_preview --parallel 2
          mkdir /tmp/reel-polarity-negative
          /tmp/reel-display/reel_display_preview /tmp/reel-polarity-negative
          python3 tests/display/check_polarity.py /tmp/reel-render /tmp/reel-polarity-negative
      - uses: actions/upload-artifact@v4
        with:
          name: reel-lcd-preview
          path: /tmp/reel-render/reel-lcd-preview.png
          if-no-files-found: error

  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4de313367288aad5aeaa1243890e40dc813f7008
    with:
      fallback_binary: hex
      archive_name: reel-zmk-build

  package:
    needs: [build, display-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reel-zmk-build
      - uses: actions/download-artifact@v4
        with:
          name: reel-lcd-preview
      - name: Package the CX-40 application for its factory USB bootloader
        run: |
          test -s reel_left.uf2 && test -s reel_right.uf2 && test -s reel_dongle.hex
          python3 tools/check-uf2.py
          curl --fail --location --retry 3 https://github.com/NordicSemiconductor/pc-nrfutil/releases/download/v6.1.7/nrfutil-linux -o nrfutil
          echo "f45cf2f552d2ccbe5dc045a1e0725415d7e65c7ebd813ad4555f21c448cf8065  nrfutil" | sha256sum -c -
          chmod +x nrfutil
          ./nrfutil pkg generate --hw-version 52 --sd-req 0x00 --application-version 1 --application reel_dongle.hex reel_dongle.zip
          unzip -t reel_dongle.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reel-zmk-firmware
          path: |
            HANDOFF-ja.md
            reel-lcd-preview.png
            reel_left.uf2
            reel_right.uf2
            reel_dongle.zip
          if-no-files-found: error
